services:
  - type: web
    name: educrop-chatbot-service
    runtime: node
    rootDir: chatbot-service
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_TTS_MODEL
        value: gemini-2.5-flash-preview-tts
      - key: GEMINI_TTS_VOICE
        value: Kore
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "https://educrop.com,https://www.educrop.com,https://educrop.netlify.app"
