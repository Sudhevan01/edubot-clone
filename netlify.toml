[build]
  command = "npm run build"
  publish = "dist"

# API reverse-proxy rule (uncomment and replace with your deployed backend URL, e.g. on Render)
# This routes all `/api/*` requests from Netlify directly to your Python backend without CORS issues:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-chatbot-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
