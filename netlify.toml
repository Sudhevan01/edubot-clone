[build]
  command = "npm run build"
  publish = "dist"

# API reverse-proxy rule: Routes all /api/* calls from Netlify directly to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://educrop-landingpage.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
